<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Icikiwir Esports</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="auth-page auth-clean-page">
  <main class="auth-clean-shell">
    <section class="auth-clean-panel">
      <div class="auth-clean-brand">
        <span class="brand-icon"><i class="ri-gamepad-fill"></i></span>
        <div>
          <strong>Icikiwir Esports</strong>
          <small>Tournament Manager</small>
        </div>
      </div>

      <div class="auth-clean-copy">
        <p class="eyebrow">Secure Access</p>
        <h1>WELCOME BACK</h1>
        <p>Please login to continue</p>
      </div>

      <p id="auth-status-message" class="auth-message"></p>

      <form id="login-form" class="auth-clean-form">
        <label class="input-wrap">
          <i class="ri-mail-line"></i>
          <input type="text" id="loginUsername" placeholder="Enter your username / admin" autocomplete="username" required>
        </label>
        <label class="input-wrap">
          <i class="ri-lock-2-fill"></i>
          <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="field-icon" id="toggle-password" aria-label="Show password"><i class="ri-eye-line"></i></button>
        </label>
        <button type="submit" class="btn auth-main-btn">LOGIN</button>
        <button type="button" class="link-btn auth-forgot">Forgot Password?</button>
        <p class="auth-switch">Don't have an account? <button id="to-register-btn" class="link-btn">SIGN UP</button></p>
      </form>

      <form id="register-form" class="auth-clean-form hidden">
        <div class="register-title">
          <h2>Create Account</h2>
          <p>Daftar sebagai Team atau Solo Player.</p>
        </div>
        <label class="input-wrap select-wrap">
          <i class="ri-user-settings-line"></i>
          <select id="regAccountType" required><option value="team">Register sebagai Team</option><option value="user">Register sebagai User / Solo Player</option></select>
        </label>
        <label class="input-wrap"><i class="ri-at-line"></i><input type="text" id="regUsername" placeholder="Username tanpa spasi" required></label>
        <label class="input-wrap"><i class="ri-team-line"></i><input type="text" id="regTeamName" placeholder="Team Name / Nama Player" required></label>
        <label class="input-wrap"><i class="ri-whatsapp-line"></i><input type="tel" id="regWhatsapp" placeholder="WhatsApp aktif, contoh 08123456789" required></label>
        <label class="input-wrap"><i class="ri-mail-line"></i><input type="email" id="regEmail" placeholder="Email @icikiwir.digital" required></label>
        <label class="input-wrap"><i class="ri-lock-password-line"></i><input type="password" id="regPassword" placeholder="Password minimal 6 karakter" required></label>
        <button type="submit" class="btn auth-main-btn success">REGISTER</button>
        <p class="auth-switch">Have account? <button id="to-login-btn" class="link-btn">LOGIN HERE</button></p>
      </form>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script type="module" src="assets/js/pages/login.js"></script>
  <script>
    const toggle = document.getElementById('toggle-password');
    const pass = document.getElementById('loginPassword');
    if (toggle && pass) {
      toggle.addEventListener('click', () => {
        const shown = pass.type === 'text';
        pass.type = shown ? 'password' : 'text';
        toggle.innerHTML = shown ? '<i class="ri-eye-line"></i>' : '<i class="ri-eye-off-line"></i>';
      });
    }
  </script>
</body>
</html>
